name: 每日更新基金看板

on:
  schedule:
    # UTC 00:00 = Asia/Shanghai 08:00. GitHub may delay scheduled jobs.
    - cron: '0 0 * * *'
    # Off-peak retries: Beijing 08:00-23:59, at minutes 7, 17 and 43.
    # A verified dataDate for today makes these cheap no-ops.
    - cron: '7,17,43 0-15 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '立即重新采集（当天已更新时仍执行；已有任务运行时复用该任务）'
        type: boolean
        default: true
        required: false

permissions:
  contents: write
  actions: read

jobs:
  preflight:
    if: github.repository == 'xm348190253/fund-panorama-wsy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: 取得代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 检查正在运行的任务及当日成功记录
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: python scripts/cloud_refresh_gate.py --preflight
  refresh:
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    concurrency:
      group: modelscope-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
      FUND_HTTP_KEEPALIVE: '1'
    steps:
      - name: 取得代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 取得生产锁后再次检查最新成功记录
        id: gate
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: python scripts/cloud_refresh_gate.py
      - name: 安装 Python
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 安装 Node
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: 检查免费运行条件及发布密钥
        if: steps.gate.outputs.proceed == 'true'
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          python - <<'PY'
          import os
          if os.environ['REPOSITORY_VISIBILITY'] != 'public':
              raise SystemExit('This workflow only runs in a public repository with a free standard runner.')
          if not os.environ.get('MODELSCOPE_API_KEY'):
              raise SystemExit('Add the MODELSCOPE_API_KEY Actions secret before running.')
          PY
      - name: 安装采集依赖
        if: steps.gate.outputs.proceed == 'true'
        run: python -m pip install -r requirements-cloud.txt
      - name: 取得魔搭最近一次成功快照作为基线
        if: steps.gate.outputs.proceed == 'true'
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
        run: |
          python scripts/modelscope_sync.py bootstrap --dist dist
          python scripts/guard_cloud_refresh.py --baseline baseline-coverage.json --capture
      - name: 全目录采集与校验（失败后同日断点重试一次）
        if: steps.gate.outputs.proceed == 'true'
        timeout-minutes: 300
        run: |
          collection_date="$(TZ=Asia/Shanghai date +%F)"
          if ! python scripts/update_all.py --workers 16; then
            echo 'Retrying the full pipeline using same-day checkpoints.'
            collection_date="$(TZ=Asia/Shanghai date +%F)"
            python scripts/update_all.py --workers 16
          fi
          python scripts/guard_cloud_refresh.py --baseline baseline-coverage.json --expected-date "$collection_date"
      - name: 构建独立静态网页及版本清单
        if: steps.gate.outputs.proceed == 'true'
        run: python scripts/build_cloud_site.py --output cloud-site --version "gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: 发布到原魔搭空间并核验实际运行版本
        if: steps.gate.outputs.proceed == 'true'
        timeout-minutes: 35
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
        run: python scripts/modelscope_sync.py publish --site cloud-site --receipt last-success.json
      - name: 保存成功更新记录
        if: steps.gate.outputs.proceed == 'true'
        run: python scripts/save_success_receipt.py --receipt last-success.json
      - name: 显示执行结果
        if: always() && steps.gate.outputs.proceed == 'true'
        env:
          RUN_RESULT: ${{ job.status }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          message = '基金看板更新已完成并验证。' if os.environ['RUN_RESULT'] == 'success' else '本次更新未完整成功，请查看失败步骤；不要将本次运行视为已更新。'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(message + '\n\n[查看魔搭看板](https://modelscope.cn/studios/wangshuyang2126/fund-panorama-wsy)\n')
          PY
