name: 发布资管看板界面
on:
  push:
    branches: [main]
    paths:
      - scripts/insurance-ui.js
      - scripts/build_cloud_site.py
      - .github/workflows/publish-dashboard.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: modelscope-production
      cancel-in-progress: false
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
    steps:
      - name: 取得最新界面源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: 安装依赖并取得当前已成功发布的数据
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
        run: |
          python -m pip install -r requirements-cloud.txt
          python scripts/modelscope_sync.py bootstrap --dist dist
      - name: 读取最近指数行情并构建界面
        run: |
          python scripts/refresh_index_quotes.py --require-any
          python scripts/build_cloud_site.py --output cloud-site --version "layout-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: 发布界面并验证全部文件
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
        run: python scripts/modelscope_sync.py publish --site cloud-site --receipt layout-receipt.json
      - name: 保存本次发布核验
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-layout-receipt
          path: layout-receipt.json
          if-no-files-found: ignore
