name: 同步独立公募看板
on:
  push:
    branches: [main]
    paths:
      - scripts/public_funds.py
      - scripts/test_public_funds.py
      - scripts/modelscope_public_funds.py
      - scripts/test_modelscope_public_funds.py
      - .github/workflows/publish-public-funds.yml
  workflow_run:
    workflows: [每日更新基金看板, 发布资管看板界面]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-funds-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'xm348190253/fund-panorama-wsy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-cloud.txt
      - name: 核验公募文件隔离规则
        run: |
          python -m unittest discover -s scripts -p 'test_public_funds.py'
          python -m unittest discover -s scripts -p 'test_modelscope_public_funds.py'
      - name: 同步国内独立公募网址
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
        run: python scripts/modelscope_public_funds.py
      - name: 发布与原看板相同的公募数据
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/public_funds.py --publish
      - name: 保存国内公募发布核验结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-funds-domestic-receipt
          path: docs/public-funds-domestic-receipt.json
          if-no-files-found: ignore
